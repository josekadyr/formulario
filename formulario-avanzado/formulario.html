
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Contacto Avanzado - Mueblería Robles</title>
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <header>
    <h1>Contáctanos</h1>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="catalogo.html">Catálogo</a>
    </nav>
  </header>

  <main>
    <section class="seccion">
      <form class="formulario" action="#" method="post">
        <h2><i class="fas fa-envelope"></i> Formulario de Contacto Avanzado</h2>

        <label for="nombre">Nombre completo:</label>
        <input type="text" id="nombre" name="nombre" required>

        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" name="email" required>

        <label for="telefono">Número de teléfono:</label>
        <input type="tel" id="telefono" name="telefono" placeholder="+591 70000000">

        <label for="direccion">Dirección:</label>
        <input type="text" id="direccion" name="direccion">

        <label for="preferencia">Tipo de mueble de interés:</label>
        <select id="preferencia" name="preferencia">
          <option value="">Seleccione...</option>
          <option value="sala">Sala</option>
          <option value="comedor">Comedor</option>
          <option value="dormitorio">Dormitorio</option>
          <option value="oficina">Oficina</option>
        </select>

        <label for="visita">¿Desea agendar una visita a la tienda?</label>
        <input type="radio" name="visita" value="sí"> Sí
        <input type="radio" name="visita" value="no"> No

        <label for="mensaje">Mensaje o comentario adicional:</label>
        <textarea id="mensaje" name="mensaje" rows="5" required></textarea>

        <button type="submit"><i class="fas fa-paper-plane"></i> Enviar</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Mueblería Robles</p>
  </footer>
</body>
</html>
